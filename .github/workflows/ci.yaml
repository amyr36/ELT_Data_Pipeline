
name: ELT Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate ELT Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r elt/requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q elt/

      - name: Build ELT Docker image
        run: |
          docker build -t elt-pipeline:ci ./elt
